name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/gialfra-corporate-website-kaap3e
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Automatically enable Pages (source = GitHub Actions) if not already enabled
          enablement: true

      - name: Fetch section photography (Unsplash License, free commercial use)
        run: |
          set -euo pipefail
          mkdir -p public/images/about
          ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          # The /photos/<id>/download API now requires an app key (returns 401).
          # Instead resolve each photo's public, auth-free images.unsplash.com CDN
          # URL from the server-rendered og:image meta tag, then request our crop.
          fetch() {
            id="$1"; out="$2"
            echo "Resolving $out ($id) ..."
            page="$(curl -fsSL --retry 5 --retry-delay 3 -A "$ua" "https://unsplash.com/photos/$id")"
            cdn="$(printf '%s' "$page" | grep -oE 'https://images\.unsplash\.com/photo-[A-Za-z0-9_-]+' | head -n1)"
            if [ -z "$cdn" ]; then
              echo "::error::Could not resolve CDN URL for $id"; exit 1
            fi
            echo "  -> $cdn"
            curl -fSL --retry 5 --retry-delay 3 -A "$ua" \
              "${cdn}?fm=jpg&w=1200&q=80&fit=crop&crop=entropy" \
              -o "public/images/about/$out"
            # Validate: must be a real JPEG of reasonable size, not an error page.
            sz="$(wc -c < "public/images/about/$out")"
            if [ "$sz" -lt 20000 ] || ! file "public/images/about/$out" | grep -qi 'JPEG'; then
              echo "::error::$out is not a valid JPEG (size=$sz)"; exit 1
            fi
            echo "  ok ($sz bytes)"
          }
          # 1 Oil & Gas (Zbyněk Burival) 2 Industrial (Jakub Żerdzicki)
          # 3 Logistics (Ozren Cuculic)  4 Technical (Simon Infanger)
          fetch GrmwVnVSSdU oil-gas.jpg
          fetch XmmL7iNeFWc industrial.jpg
          fetch eBKxooPEU5w logistics.jpg
          fetch DkTmBA443g4 technical.jpg
          echo "--- fetched section photos ---"
          ls -la public/images/about
          file public/images/about/*.jpg

      - name: Build
        # Project site served at https://<owner>.github.io/ok-gialfra-website/
        run: npm run build -- --base=/ok-gialfra-website/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
